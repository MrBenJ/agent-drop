name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      - run: swift build -c release --product drop
      - name: Real-binary smoke test (ephemeral runner only)
        run: Scripts/smoke.sh .build/release/drop
